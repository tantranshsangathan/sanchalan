name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/schemalint schemas
      - run: python3 -m pip install cryptography==46.0.5
      - run: python3 -I testvectors/tools/vectors.py check testvectors/canonicalization/vectors.json
      - run: testvectors/tools/openssl_verify.sh testvectors/canonicalization/vectors.json
